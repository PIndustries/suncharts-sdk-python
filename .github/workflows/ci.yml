name: ci
on:
  push: { branches: [main], tags: ["v*"] }
  pull_request:
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    strategy: { matrix: { python: ["3.9", "3.12", "3.13"] } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python }}" }
      - run: pip install -e '.[test]'
      - run: pytest -q
  generated-up-to-date:
    # src/suncharts_api must be exactly what scripts/generate.sh produces from openapi.json.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "21" }
      - run: scripts/generate.sh
      - run: git status --porcelain && git diff --exit-code
  sandbox-smoke:
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    env:
      SUNCHARTS_CLIENT_ID: ${{ secrets.SUNCHARTS_SANDBOX_CLIENT_ID }}
      SUNCHARTS_CLIENT_SECRET: ${{ secrets.SUNCHARTS_SANDBOX_CLIENT_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -e .
      - name: smoke (skipped without sandbox secrets)
        run: |
          if [ -z "$SUNCHARTS_CLIENT_ID" ]; then echo "::notice::no sandbox secrets; skipping"; exit 0; fi
          python examples/sandbox_smoke.py
